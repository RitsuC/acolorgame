<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Color Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; background: #393939; }

    /* bg scales with width, top-aligned, no crop */
    #bg-wrap {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      z-index: 0;
      perspective: 1200px;
      overflow: hidden;
    }
    .bg {
      width: 105%;
      margin-left: -2.5%;
      /* extra vertical room so vertical shift doesn't show edges */
      padding-top: 2.5%;
      padding-bottom: 2.5%;
      margin-top: -2.5%;
      background-image: url('bg_0.png');
      background-size: 100% auto;
      background-position: top left;
      background-repeat: no-repeat;
      transform-origin: center center;
      transition: transform 0.12s ease-out;
      will-change: transform;
    }

    /* Footer — sits below the image, fills remaining viewport height */
    #footer {
      position: absolute;
      left: 0;
      width: 100%;
      background: #393939;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      min-height: 120px;
    }

    #footer h1 {
      font-family: 'Itim', cursive;
      font-size: clamp(1rem, 2.5vw, 2.5rem);
      color: #ffffff;
      letter-spacing: 0.02em;
      text-align: center;
      padding: 2vw;
    }

    #bg1 {
      position: absolute;
      z-index: 1;
      pointer-events: none;
    }
    #bg1 img {
      width: 100%;
      height: auto;
      display: block;
    }

    .btn {
      position: absolute;
      z-index: 5;
      cursor: pointer;
      transition: filter 0.18s ease;
      text-decoration: none;
      border: none;
      background: none;
      padding: 0;
    }
    .btn:hover { filter: brightness(1.08) drop-shadow(0 8px 24px rgba(0,0,0,0.18)); }
    .btn:active { filter: brightness(0.95); }
    .btn img { width: 100%; height: 100%; object-fit: contain; display: block; }

    #scratch-canvas {
      position: absolute;
      top: 0; left: 0;
      z-index: 10;
      touch-action: none;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div id="bg-wrap"><div class="bg" id="bg"></div></div>
  <div id="bg1"><img src="bg_1.png" alt="" /></div>

  <div id="footer"><h1>a color game</h1></div>

  <a class="btn" id="btn1" href="https://ritttsu.itch.io/a-color-game" target="_blank" rel="noopener">
    <img src="btn_playthegame.png" alt="Play the game" />
  </a>
  <a class="btn" id="btn2" href="https://www.youtube.com/@Ritttsu37" target="_blank" rel="noopener">
    <img src="btn_devlog.png" alt="Watch the devlog" />
  </a>
  <a class="btn" id="btn3" href="https://discord.gg/EJ246FPc2g" target="_blank" rel="noopener">
    <img src="btn_discord.png" alt="Join our Discord" />
  </a>

  <canvas id="scratch-canvas"></canvas>

  <script>
    const IMG_W = 3840, IMG_H = 2160;

    const BTN_DEFS = [
      { id: 'btn1', x: 316,  y: 1652, w: 933, h: 314 },
      { id: 'btn2', x: 1454, y: 1652, w: 933, h: 314 },
      { id: 'btn3', x: 2590, y: 1652, w: 933, h: 314 },
    ];

    function getScale() { return window.innerWidth / IMG_W; }

    function layoutAll() {
      const scale = getScale();
      const renderedH = IMG_H * scale;

      // bg height
      document.getElementById('bg').style.height = renderedH + 'px';
      document.getElementById('bg-wrap').style.height = renderedH + 'px';

      // footer: starts right below the image, fills rest of viewport
      const footer = document.getElementById('footer');
      footer.style.top = renderedH + 'px';
      const footerH = Math.max(window.innerHeight - renderedH, 120);
      footer.style.height = footerH + 'px';

      // body total height
      document.body.style.height = (renderedH + footerH) + 'px';

      // bg1
      const bg1El = document.getElementById('bg1');
      const BG1_X = 805.5, BG1_Y = 236, BG1_W = 2229; // in image pixels
      bg1El.style.left  = (BG1_X * scale) + 'px';
      bg1El.style.top   = (BG1_Y * scale) + 'px';
      bg1El.style.width = (BG1_W * scale) + 'px';

      // buttons
      BTN_DEFS.forEach(({ id, x, y, w, h }) => {
        const el = document.getElementById(id);
        el.style.left   = (x * scale) + 'px';
        el.style.top    = (y * scale) + 'px';
        el.style.width  = (w * scale) + 'px';
        el.style.height = (h * scale) + 'px';
      });
    }

    window.addEventListener('resize', () => { layoutAll(); drawCover(); });
    layoutAll();

    // ── Scratch canvas ──
    const canvas = document.getElementById('scratch-canvas');
    const ctx = canvas.getContext('2d');
    const BRUSH_SIZE = 48;

    const mask = document.createElement('canvas');
    const mctx = mask.getContext('2d');

    const coverImg = new Image();
    coverImg.src = 'drawingcover.png';
    coverImg.onload = () => { layoutAll(); drawCover(); };
    coverImg.onerror = () => { layoutAll(); };

    function drawCover() {
      const scale = getScale();
      const cw = window.innerWidth;
      const ch = IMG_H * scale;

      canvas.width = cw;
      canvas.height = ch;
      mask.width = cw;
      mask.height = ch;

      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, cw, ch);
      if (coverImg.complete && coverImg.naturalWidth > 0) {
        // Same as bg: scale by width, top-aligned, no crop
        const iw = coverImg.naturalWidth, ih = coverImg.naturalHeight;
        const drawW = cw;
        const drawH = ih * (cw / iw);
        ctx.drawImage(coverImg, 0, 0, drawW, drawH);
      }
      mctx.fillStyle = '#000';
      mctx.fillRect(0, 0, cw, ch);
    }

    function scratch(x, y) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath(); ctx.arc(x, y, BRUSH_SIZE, 0, Math.PI * 2); ctx.fill();
      mctx.globalCompositeOperation = 'destination-out';
      mctx.beginPath(); mctx.arc(x, y, BRUSH_SIZE, 0, Math.PI * 2); mctx.fill();
    }

    function isScratched(x, y) { return mctx.getImageData(x, y, 1, 1).data[3] < 64; }

    function forwardClick(x, y) {
      canvas.style.pointerEvents = 'none';
      const el = document.elementFromPoint(x, y);
      canvas.style.pointerEvents = 'auto';
      if (el && el !== canvas) el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
    }

    let isDown = false, downX = 0, downY = 0;
    canvas.addEventListener('mousedown', (e) => { isDown = true; downX = e.clientX; downY = e.clientY; scratch(e.clientX, e.clientY); });
    canvas.addEventListener('mousemove', (e) => { if (isDown) scratch(e.clientX, e.clientY); });
    window.addEventListener('mouseup', () => { isDown = false; });
    canvas.addEventListener('click', (e) => {
      if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) < 5 && isScratched(e.clientX, e.clientY))
        forwardClick(e.clientX, e.clientY);
    });

    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDown = true; const t = e.touches[0]; touchStartX = t.clientX; touchStartY = t.clientY; scratch(t.clientX, t.clientY); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (isDown) scratch(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    canvas.addEventListener('touchend', (e) => {
      isDown = false; const t = e.changedTouches[0];
      if (Math.abs(t.clientX - touchStartX) + Math.abs(t.clientY - touchStartY) < 5 && isScratched(t.clientX, t.clientY))
        forwardClick(t.clientX, t.clientY);
    });

    // ── Mouse parallax + springy perspective ──
    const bgEl = document.getElementById('bg');
    const MAX_SHIFT = 2.5;
    const MAX_ROT   = 5;

    // Spring constants — higher stiffness = snappier, lower damping = more bouncy
    const STIFFNESS = 0.045;
    const DAMPING   = 0.62;

    let tX = 0, tY = 0;
    let posX = 0, posY = 0;
    let velX = 0, velY = 0;

    document.addEventListener('mousemove', (e) => {
      const nx = (e.clientX / window.innerWidth)  * 2 - 1;
      const ny = (e.clientY / window.innerHeight) * 2 - 1;
      tX =  nx;
      tY = -ny;
    });

    function animateParallax() {
      // Spring physics: F = -k * displacement, apply damping to velocity
      const forceX = (tX - posX) * STIFFNESS;
      const forceY = (tY - posY) * STIFFNESS;
      velX = (velX + forceX) * DAMPING;
      velY = (velY + forceY) * DAMPING;
      posX += velX;
      posY += velY;

      const tx   =  posX * MAX_SHIFT;
      const ty   =  posY * MAX_SHIFT;
      const rotY =  posX * MAX_ROT;
      const rotX = -posY * MAX_ROT;
      bgEl.style.transform =
        `translateX(${tx}%) translateY(${ty}%) rotateY(${rotY}deg) rotateX(${rotX}deg)`;
      requestAnimationFrame(animateParallax);
    }
    animateParallax();
  </script>
</body>
</html>
